# diaspora.conf - the peers of this repository, what moves between them and
# what an import must pass.  Read by diaspora (github.com/kev-cam/diaspora).
# Values run to the end of the line as written; comments are whole lines.
# Settings for one machine only go in diaspora.local.conf (not committed).

[diaspora]
	target = main
	import = bugfix security perf
	ignore = docs ci style
	export = bugfix

# This repository is the TightVNC 1.3.10 release for Unix (history up to it
# from github.com/TurboVNC/tightvnc, which keeps the old releases and
# nothing since), then Debian's patches as of 1:1.3.10-11, then our work.
# Only vnc_unixsrc is built and tested here.

# NetLinux's fork of the same history: build fixes for current compilers,
# 64 bit crashes, viewer features (-scale, -sshvnc).  It builds with imake,
# which Debian's Makefiles replaced here, and has packaging of its own.
[peer "netlinux"]
	url = https://github.com/netlinux-ai/tightvnc.git
	branch = main
	exclude = .github/** .gitignore vnc_unixsrc/tightvnc.spec vnc_winsrc/** vnc_javasrc/**

# Debian's packaging, where security fixes for 1.3.10 arrive.  It shares no
# history with this repository: its tree is vnc_unixsrc without that
# directory around it, and its fixes are patch files under debian/patches,
# not changes to the sources.  Everything up to 1:1.3.10-11 (55487d93) is
# here already, one commit per patch.  A later commit of theirs touches
# files we do not have, so it is set aside (`diaspora list --all` shows it)
# and has to be taken on purpose (`diaspora import --pick`), for the agent
# to carry the patch over to vnc_unixsrc.
[peer "debian"]
	url = https://salsa.debian.org/debian-remote-team/tightvnc.git
	branch = debian/unstable
	since = 55487d930e9b7b24b091b0e8d8d1f0c3d3e73f72

# One fix for a redefinition error in Xvnc (2019).
[peer "tov"]
	url = https://github.com/tov/tightvnc.git
	branch = master

# Not peers: the forks that work on the Windows server and viewer
# (github.com/GenSayer/tightvnc, datadiode/tightvnc) or carry the Windows
# only 2.x releases (CendioOssman/tightvnc, chenall/tightvnc).  Nothing
# here builds or tests vnc_winsrc, so nothing of theirs could be gated.

# Debian's build system took the place of imake: its files are gone.
[divergence]
	removed = vnc_unixsrc/Imakefile vnc_unixsrc/**/Imakefile vnc_unixsrc/Xvnc/config/** vnc_unixsrc/Xvnc/configure
	lists = vnc_unixsrc/WhatsNew vnc_unixsrc/ChangeLog

# Commands run in the import worktree ($DIASPORA_SRC).  The build is in
# the source tree and its Makefiles know nothing of headers, so an object
# is not rebuilt when a header it includes changes: everything is built
# again each time (ten seconds).  The X server alone is built (libvncauth
# and Xvnc: zlib and libjpeg); the viewer wants the X toolkit libraries.
# TIGHTVNC_CPPFLAGS and TIGHTVNC_LDFLAGS are for a machine whose libjpeg
# headers are not in the usual place.
[test "compile"]
	run = cd "$DIASPORA_SRC/vnc_unixsrc" && smak clean >/dev/null 2>&1; cd "$DIASPORA_SRC/vnc_unixsrc" && CPPFLAGS="$TIGHTVNC_CPPFLAGS" LDFLAGS="$TIGHTVNC_LDFLAGS" smak -j"$(nproc)" server
	run = test -x "$DIASPORA_SRC/vnc_unixsrc/Xvnc/programs/Xserver/Xvnc"
	timeout = 20m

# tests/run-tests: the server that was just built, started on displays of
# its own and driven over RFB and Xpra.  It lists the tests that fail; a
# test that needs a program this machine lacks is skipped.  The gate is
# that no test fails that did not fail before the import, a new failure
# being run a second time before it counts.
[test "full-regression"]
	needs = compile
	run = cd "$DIASPORA_SRC/vnc_unixsrc/tests" && ./run-tests --failures "$DIASPORA_FAILURES"
	pass = no-new-failures
	retry = 1
	timeout = 30m

# Every import passes the tests, whatever kind of change it is.
[require]
	default = full-regression
